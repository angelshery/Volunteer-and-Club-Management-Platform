
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Clubs | Cluviora</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <div class="dashboard-layout">

        <!-- Student Sidebar -->
        <aside class="sidebar">

            <h2>Cluviora</h2>

            <nav>
                <a href="/dashboard">Overview</a>
                <a href="/clubs" class="active">Explore Clubs</a>
                <a href="/opportunities">Volunteer Opportunities</a>
                <a href="/my-events">My Events</a>
                <a href="/profile">My Profile</a>
                <a href="/logout">Logout</a>
            </nav>

        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">

            <div class="explore-header">
                <h1>Explore Clubs</h1>

                <p>
                    Discover communities that match your interests,
                    develop new skills, and make a difference.
                </p>
            </div>

            <!-- Search and Filter -->
            <div class="club-filters">

                <input
                    type="search"
                    id="clubSearch"
                    placeholder="Search clubs by name or keyword..."
                    aria-label="Search clubs"
                >

                <select id="categoryFilter" aria-label="Filter by category">
                    <option value="All">All Categories</option>
                    <option value="Technology">Technology</option>
                    <option value="Education">Education</option>
                    <option value="Environment">Environment</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Community Service">Community Service</option>
                    <option value="Arts &amp; Culture">Arts &amp; Culture</option>
                    <option value="Sports">Sports</option>
                    <option value="Other">Other</option>
                </select>

                <select id="membershipFilter" aria-label="Filter by membership">
                    <option value="All">All Clubs</option>
                    <option value="Joined">My Clubs</option>
                    <option value="Not Joined">Not Joined</option>
                </select>

            </div>

            <!-- Results Count -->
            <p id="clubResultsCount"></p>

            <!-- Success or Error Message -->
            <p id="studentClubMessage" aria-live="polite"></p>

            <!-- Dynamically Generated Club Cards -->
            <div id="studentClubsList"></div>

        </main>

    </div>

    <script src="/js/clubs.js"></script>

</body>
</html>
