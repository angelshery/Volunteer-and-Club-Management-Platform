
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Events | Cluviora</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <div class="dashboard-layout">

        <!-- Student Sidebar -->
        <aside class="sidebar">

            <h2>Cluviora</h2>

            <nav>
                <ul>
                    <li><a href="/dashboard">Dashboard</a></li>
                    <li><a href="/clubs">Explore Clubs</a></li>
                    <li><a href="/opportunities">Volunteer Opportunities</a></li>
                    <li><a href="/my-events" class="active">My Events</a></li>
                    <li><a href="/profile">My Profile</a></li>
                    <li><a href="/logout">Logout</a></li>
                </ul>
            </nav>

        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">

            <div class="explore-header">
            </nav>

        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">

            <div class="explore-header">

                <h1>My Events</h1>

                <p>
                    Track your volunteer registrations,
                    attendance, and verified volunteer hours.
                </p>

            </div>

            <!-- Volunteer Statistics -->
            <div class="my-events-stats">

                <div class="profile-card">
                    <h3>Total Registrations</h3>
                    <h2 id="myTotalRegistrations">0</h2>
                </div>

                <div class="profile-card">
                    <h3>Events Attended</h3>
                    <h2 id="myEventsAttended">0</h2>
                </div>

                <div class="profile-card">
                    <h3>Verified Volunteer Hours</h3>
                    <h2 id="myVerifiedHours">0</h2>
                </div>

            </div>

            <!-- Event Filters -->
            <div class="club-filters">

                <select id="myEventFilter"
                        aria-label="Filter my events">

                    <option value="All">All Events</option>
                    <option value="Upcoming">Upcoming Events</option>
                    <option value="Past">Past Events</option>
                    <option value="Attended">Attended</option>
                    <option value="Absent">Absent</option>

                </select>

            </div>

            <!-- Event Count -->
            <p id="myEventsCount"></p>

            <!-- Messages -->
            <p id="myEventsMessage" aria-live="polite"></p>

            <!-- Dynamically Generated Event Cards -->
            <div id="myEventsList"></div>

        </main>

    </div>

    <script src="/js/my-events.js"></script>

</body>

</html>
